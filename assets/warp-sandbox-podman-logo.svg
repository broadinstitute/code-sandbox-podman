<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 170" width="600" role="img"
     aria-label="A seal balancing a container box on its nose, inside a sandbox frame">
  <title>warp-sandbox-podman</title>
  <desc>Original artwork for this fork. A seal (podman) balancing a container
  box, framed by a sandbox boundary. No upstream assets are used.</desc>

  <!-- Palette chosen to read on both light and dark GitHub themes: no pure
       white or black, mid-tone fills only. -->
  <g fill="none" stroke="#8b8b9a" stroke-width="2.5" stroke-linejoin="round" opacity="0.55">
    <!-- sandbox boundary: broken on purpose, the mounts are the openings -->
    <path d="M40 14 H26 a12 12 0 0 0 -12 12 V44"/>
    <path d="M14 108 V144 a12 12 0 0 0 12 12 H62"/>
    <path d="M220 14 H234 a12 12 0 0 1 12 12 V60"/>
    <path d="M246 116 V144 a12 12 0 0 1 -12 12 H150"/>
  </g>

  <!-- container box, balanced -->
  <g transform="translate(196 34) rotate(-8)">
    <path d="M0 12 L15 3 L30 12 L15 21 Z" fill="#e8a33d"/>
    <path d="M0 12 L15 21 L15 38 L0 29 Z" fill="#c9862c"/>
    <path d="M30 12 L15 21 L15 38 L30 29 Z" fill="#a86e22"/>
  </g>

  <!-- seal -->
  <g>
    <!-- tail fluke -->
    <path d="M30 128 C22 120 18 112 22 106 C28 112 34 116 40 118 Z" fill="#4a3d73"/>
    <path d="M28 136 C20 134 16 128 18 122 C26 126 33 128 40 128 Z" fill="#4a3d73"/>

    <!-- body: tail (left) sweeping up the back to the snout (right) -->
    <path d="M36 124
             C34 108 44 88 66 76
             C92 62 128 56 152 52
             C166 50 176 52 182 56
             C190 61 190 68 184 71
             C176 75 166 74 158 76
             C150 78 146 84 148 92
             C150 104 146 116 134 124
             C118 134 92 138 68 136
             C48 134 38 132 36 124 Z"
          fill="#5b4b8a"/>

    <!-- belly highlight -->
    <path d="M52 126 C56 116 68 108 88 106 C110 104 128 108 136 116
             C126 128 100 134 76 133 C62 132 54 130 52 126 Z"
          fill="#7c6bb0" opacity="0.85"/>

    <!-- front flipper -->
    <path d="M104 108 C114 110 124 118 128 128 C118 132 104 130 96 124
             C92 120 96 110 104 108 Z"
          fill="#4a3d73"/>

    <!-- snout + nose -->
    <circle cx="184" cy="64" r="3.4" fill="#2d2a3e"/>
    <!-- eye -->
    <circle cx="163" cy="60" r="3.2" fill="#2d2a3e"/>
    <circle cx="164.1" cy="58.9" r="1.05" fill="#f2f0f7"/>

    <!-- whiskers -->
    <g stroke="#2d2a3e" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
      <path d="M180 70 L192 74"/>
      <path d="M179 72 L190 79"/>
      <path d="M177 74 L186 82"/>
    </g>
  </g>

  <!-- rootless: no crown, just ground -->
  <path d="M20 150 H240" stroke="#8b8b9a" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
</svg>
